[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porous-airfoil-panel-method"
version = "1.0.0"
description = "Porous-airfoil source-vortex panel method and publication pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kushal Umamahesh"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
performance = ["numba>=0.59"]
dev = ["pytest>=8.0"]

[project.scripts]
porous-airfoil = "porous_airfoil.__main__:main"

[tool.setuptools.packages.find]
include = ["porous_airfoil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
